name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    # 毎週月曜 05:00 JST。人口は毎月、防災設備は随時の更新
    - cron: "0 20 * * 0"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: nerima
      # Node は渡さない。住所の座標は geocode_cache.ndjson にコミットしてあり、
      # ビルドは abr-geocoder を呼ばない。ABR の配布は日本国外からは取れず、
      # ホストランナーからは zip でないファイルが返るので、CI では引けない。
      #
      # ランナーには Node が最初から入っているため、これを外すだけでは
      # abr-geocoder を呼ばない保証にならない。pipelines/geocode.py が CI を見て
      # 引きに行く前に落とす。キャッシュに無い住所が出たらそこで止まるので、
      # 国内から更新してコミットする
    secrets: inherit
