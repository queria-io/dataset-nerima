schema: bosai
name: homecoming_support_station
title: 帰宅支援ステーション
description: 練馬区が公開する「帰宅支援ステーション」。災害時に帰宅困難者へ水道水・トイレ・情報を提供する施設。自治体標準オープンデータセットの指定緊急避難場所の様式で公開されており、災害種別ごとの対応可否を BOOLEAN で持つ。実データで値が入っているのは地震だけ（2026-09-26 時点の実測）。
keywords:
- 練馬区
- 東京都
- 防災
- 帰宅困難者
- GIS
published: true
sources:
- path: https://www.city.nerima.tokyo.jp/kusei/tokei/opendata/opendatasite/bosai/kitakusien.html
fields:
- name: municipality_code
  title: 全国地方公共団体コード
  description: 原典の表記のまま
  semantic: { role: entity, name: city }
- name: municipality_name
  title: 地方公共団体名
- name: address_municipality_code
  title: 所在地の全国地方公共団体コード
  semantic: { role: entity, name: city }
- name: facility_id
  title: ID
  description: 原典は空欄（2026-09-26 時点の実測）
- name: name
  title: 名称
- name: name_kana
  title: 名称カナ
- name: name_en
  title: 名称英字
- name: town_id
  title: 町字ID
- name: address
  title: 所在地
  description: 所在地の連結表記
- name: prefecture
  title: 都道府県
- name: city
  title: 市区町村
- name: town
  title: 町字
- name: street_number
  title: 番地以下
- name: building_name
  title: 建物名等
- name: lat
  title: 緯度
  description: 原典の値
- name: lon
  title: 経度
  description: 原典の値
- name: geo_lat
  title: 緯度（地図表示用）
  description: Queria が付与。原典の緯度経度が使えればその値、使えなければ住所から求めた値。由来は geo_source を見る
- name: geo_lon
  title: 経度（地図表示用）
  description: Queria が付与。geo_lat と対になる経度
- name: geo_source
  title: 座標の由来
  description: source=原典のまま、source_swapped=原典で緯度と経度が入れ替わっていたので入れ替えて採用、abr=住所から求めた値
- name: geo_level
  title: 座標の粒度
  description: 原典由来は source。住所から求めた場合は residential_detail / residential_block / machiaza_detail / machiaza
- name: geometry
  title: ジオメトリ
  description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
- name: elevation
  title: 標高
  description: メートル
- name: phone_number
  title: 電話番号
- name: extension
  title: 内線番号
- name: contact_email
  title: 連絡先メールアドレス
- name: contact_form_url
  title: 連絡先FormURL
- name: contact_note
  title: 連絡先備考
- name: postal_code
  title: 郵便番号
  semantic: { role: entity, name: postal_code }
- name: for_flood
  title: 災害種別_洪水
  description: 対応=true、非対応=false、不明=NULL（以下の災害種別も同じ）
- name: for_landslide
  title: 災害種別_崖崩れ土石流地滑り
- name: for_storm_surge
  title: 災害種別_高潮
- name: for_earthquake
  title: 災害種別_地震
- name: for_tsunami
  title: 災害種別_津波
- name: for_large_fire
  title: 災害種別_大規模な火事
- name: for_inland_flooding
  title: 災害種別_内水氾濫
- name: for_volcano
  title: 災害種別_火山現象
- name: shelter_overlap
  title: 指定避難所との重複
- name: url
  title: URL
- name: image
  title: 画像
- name: image_license
  title: 画像のライセンス
- name: notes
  title: 備考
- name: extras
  title: 追加列
  description: 標準列にマッピングできなかった原典の列（JSON）
- name: source_title
  title: 原典のデータセット名
- name: source_url
  title: 取得元URL
- name: source_page
  title: 公開ページ
  description: 練馬区サイト上の、このデータの公開ページ
