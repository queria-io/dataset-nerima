schema: bosai
name: emergency_water_station
title: 災害時給水ステーション
description: |-
  練馬区が公開する「災害時給水ステーション」です。断水時に応急給水を行う浄水所・給水所・応急給水槽の種別と、確保水量（原典の記述のまま）を持ちます。

  - 地図に表示するときは、Queria が付与した geo_lat・geo_lon を使ってください
keywords:
- 練馬区
- 東京都
- 防災
- 給水
- 断水
- GIS
annotations: { queria: { themes: [justice_safety_environment] } }
sources:
- path: https://www.city.nerima.tokyo.jp/kusei/tokei/opendata/opendatasite/bosai/kyuusui.html
fields:
- name: municipality_code
  title: 全国地方公共団体コード
  description: 原典の表記のまま
  annotations: { queria: { semantic: { role: entity, name: city } } }
- name: municipality_name
  title: 地方公共団体名
- name: address_municipality_code
  title: 所在地の全国地方公共団体コード
  annotations: { queria: { semantic: { role: entity, name: city } } }
- name: facility_id
  title: ID
  description: 原典は空欄（2026-09-26 時点の実測）
- name: name
  title: 名称
- name: name_kana
  title: 名称カナ
- name: name_en
  title: 名称英字
- name: town_id
  title: 町字ID
- name: address
  title: 所在地
  description: 所在地の連結表記
- name: prefecture
  title: 都道府県
- name: city
  title: 市区町村
- name: town
  title: 町字
- name: street_number
  title: 番地以下
- name: building_name
  title: 建物名等
- name: lat
  title: 緯度
  description: 原典の値
- name: lon
  title: 経度
  description: 原典の値
- name: geo_lat
  title: 緯度（地図表示用）
  description: 地図表示用の緯度（Queria が付与）。原典の値か住所から求めた値。由来は geo_source
- name: geo_lon
  title: 経度（地図表示用）
  description: Queria が付与。geo_lat と対になる経度
- name: geo_source
  title: 座標の由来
  description: source=原典のまま、source_swapped=緯度と経度を入れ替えた値、abr=住所から求めた値
- name: geo_level
  title: 座標の粒度
  description: 座標の粒度。原典由来は source、住所からは residential_detail〜machiaza
- name: geometry
  title: ジオメトリ
  description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
- name: elevation
  title: 標高
  description: メートル
- name: phone_number
  title: 電話番号
- name: extension
  title: 内線番号
- name: contact_email
  title: 連絡先メールアドレス
- name: contact_form_url
  title: 連絡先FormURL
- name: contact_note
  title: 連絡先備考
- name: postal_code
  title: 郵便番号
  annotations: { queria: { semantic: { role: entity, name: postal_code } } }
- name: water_type_purification
  title: 種別_浄水所給水所
  description: 該当=true、非該当=false、不明=NULL（以下の種別も同じ）
- name: water_type_emergency_tank
  title: 種別_応急給水槽
- name: water_type_small_tank
  title: 種別_小規模応急給水槽
- name: secured_volume
  title: 確保水量
  description: 原典の自由記述のまま（「1500立方メートル」など）
- name: url
  title: URL
- name: image
  title: 画像
- name: image_license
  title: 画像のライセンス
- name: notes
  title: 備考
- name: extras
  title: 追加列
  description: 標準列にマッピングできなかった原典の列（JSON）
- name: source_title
  title: 原典のデータセット名
- name: source_url
  title: 取得元URL
- name: source_page
  title: 公開ページ
  description: 練馬区サイト上の、このデータの公開ページ
