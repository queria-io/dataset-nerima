version: 2

models:
- name: evacuation_base
  access: public
  data_tests:
  - ods_geo_consistent
  - ods_geo_coverage
  - ods_geocode_coverage
  columns:
  - name: name
    data_tests:
    - not_null
  - name: address
    data_tests:
    - not_null
  - name: lat
  - name: lon
  - name: geo_lat
  - name: geo_lon
  - name: geo_source
  - name: geo_level
  - name: geometry
  - name: extras
  - name: source_title
  - name: source_url
  - name: source_page

