schema: bosai
name: evacuation_base
title: 避難拠点
description: |-
  練馬区が公開する「避難拠点」です。区立小中学校に設置される避難拠点の名称・所在地・位置を持ちます。

  - 所在地は「東京都練馬区」を含みません
  - 災害対策基本法の指定緊急避難場所は metro_tokyo.ods.evacuation_space にあります
  - 地図に表示するときは、Queria が付与した geo_lat・geo_lon を使ってください
keywords:
- 練馬区
- 東京都
- 防災
- 避難
- 学校
- GIS
annotations: { queria: { themes: [justice_safety_environment] } }
sources:
- path: https://www.city.nerima.tokyo.jp/kusei/tokei/opendata/opendatasite/bosai/hinankyoten.html
fields:
- name: name
  title: 名称
  description: 学校名の略称（「旭丘小」など）
- name: address
  title: 所在地
  description: 原典の表記のまま。都道府県名と区名を含まない
- name: lat
  title: 緯度
  description: 原典の値
- name: lon
  title: 経度
  description: 原典の値
- name: geo_lat
  title: 緯度（地図表示用）
  description: 地図表示用の緯度（Queria が付与）。原典の値か住所から求めた値。由来は geo_source
- name: geo_lon
  title: 経度（地図表示用）
  description: Queria が付与。geo_lat と対になる経度
- name: geo_source
  title: 座標の由来
  description: source=原典のまま、source_swapped=緯度と経度を入れ替えた値、abr=住所から求めた値
- name: geo_level
  title: 座標の粒度
  description: 座標の粒度。原典由来は source、住所からは residential_detail〜machiaza
- name: geometry
  title: ジオメトリ
  description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
- name: extras
  title: 追加列
  description: 標準列にマッピングできなかった原典の列（JSON）
- name: source_title
  title: 原典のデータセット名
- name: source_url
  title: 取得元URL
- name: source_page
  title: 公開ページ
  description: 練馬区サイト上の、このデータの公開ページ
