  description: 標準列にマッピングできなかった原典の列（JSON）
- name: source_title
  title: 原典のデータセット名
- name: source_url
  title: 取得元URL
- name: source_page
  title: 公開ページ
  description: 練馬区サイト上の、このデータの公開ページ
