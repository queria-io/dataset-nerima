schema: bosai
name: disaster_well
title: 防災井戸
description: 練馬区が公開する「防災井戸」と「学校防災井戸」を1表にまとめたもの。災害時に生活用水として使える井戸で、category が 民間 と 学校 を分ける。原典は緯度経度の列を持つが全行空のため、地図表示用の座標はすべて住所から求めた値（2026-09-26 時点の実測）。区が座標を入れれば原典の値が優先される。
keywords:
- 練馬区
- 東京都
- 防災
- 井戸
- 生活用水
- GIS
published: true
sources:
- path: https://www.city.nerima.tokyo.jp/kusei/tokei/opendata/opendatasite/bosai/bousaiido.html
fields:
- name: category
  title: 区分
  description: 民間=防災井戸、学校=学校防災井戸。原典が別ファイルで公開している2つを1表にまとめたときの出どころ
- name: municipality_code
  title: 全国地方公共団体コード
  description: 原典の表記のまま
- name: municipality_name
  title: 地方公共団体名
- name: address_municipality_code
  title: 所在地の全国地方公共団体コード
- name: facility_id
  title: ID
  description: 原典は空欄（2026-09-26 時点の実測）
- name: name
  title: 名称
- name: name_kana
  title: 名称カナ
- name: name_en
  title: 名称英字
- name: town_id
  title: 町字ID
- name: address
  title: 所在地
  description: 所在地の連結表記
- name: prefecture
  title: 都道府県
- name: city
  title: 市区町村
- name: town
  title: 町字
- name: street_number
  title: 番地以下
- name: building_name
  title: 建物名等
- name: lat
  title: 緯度
  description: 原典の値
- name: lon
  title: 経度
  description: 原典の値
- name: geo_lat
  title: 緯度（地図表示用）
  description: Queria が付与。原典の緯度経度が使えればその値、使えなければ住所から求めた値。由来は geo_source を見る
- name: geo_lon
  title: 経度（地図表示用）
  description: Queria が付与。geo_lat と対になる経度
- name: geo_source
  title: 座標の由来
  description: source=原典のまま、source_swapped=原典で緯度と経度が入れ替わっていたので入れ替えて採用、abr=住所から求めた値
- name: geo_level
  title: 座標の粒度
  description: 原典由来は source。住所から求めた場合は residential_detail / residential_block / machiaza_detail / machiaza
- name: geometry
  title: ジオメトリ
  description: Queria が付与。geo_lat / geo_lon から作った POINT。座標が無い行は NULL
- name: elevation
  title: 標高
  description: メートル
- name: phone_number
  title: 電話番号
- name: extension
  title: 内線番号
- name: contact_email
  title: 連絡先メールアドレス
- name: contact_form_url
  title: 連絡先FormURL
- name: contact_note
  title: 連絡先備考
- name: postal_code
  title: 郵便番号
- name: url
  title: URL
- name: image
  title: 画像
- name: image_license
  title: 画像のライセンス
- name: notes
  title: 備考
