version: 2

models:
- name: summary
  access: public
  data_tests:
  - unique_key:
      columns: [survey_month, item, category]
  columns:
  - name: survey_month
    data_tests:
    - not_null
  - name: item
    data_tests:
    - not_null
  - name: category
  - name: value
  - name: unit
  - name: source_url
  - name: source_page

- name: by_town
  access: public
  data_tests:
  - unique_key:
      columns: [survey_month, town]
  columns:
  - name: survey_month
    data_tests:
    - not_null
  - name: town
    data_tests:
    - not_null
  - name: area_level
    data_tests:
    - not_null
    - accepted_values:
        values: ["総数", "町域計", "丁目"]
  - name: town_name
  - name: chome
  - name: chome_number
  - name: households
  - name: male
  - name: female
  - name: total
  - name: source_url
  - name: source_page

- name: by_age
  access: public
  data_tests:
  - unique_key:
      columns: [survey_month, age, sex]
  columns:
  - name: survey_month
    data_tests:
    - not_null
  - name: age
    data_tests:
    - not_null
  - name: age_years
  - name: is_total
    data_tests:
    - not_null
  - name: sex
    data_tests:
    - not_null
    - accepted_values:
        values: ["合計", "男性", "女性"]
  - name: value
  - name: unit
  - name: source_url
  - name: source_page
