schema: population
name: by_age
title: 世帯と人口（年齢別）
description: |-
  練馬区が公開する「世帯と人口（年齢別）」です。住民基本台帳による 1 歳刻みの人口を月次で持ち、1 行が調査年月 × 年齢 × 性別です。2017 年 4 月からです。

  - 総計と年齢不詳の行を含みます。年齢を足すときは is_total = false で絞ってください
  - 2021 年 10〜12 月と 2024 年 6 月は原典に無く、行がありません
  - 2026 年 6 月は性別の「合計」の行が無く、男性と女性だけです
keywords:
- 練馬区
- 東京都
- 人口
- 年齢
- 高齢化
- 住民基本台帳
annotations: { queria: { themes: [population] } }
sources:
- path: https://www.city.nerima.tokyo.jp/kusei/tokei/opendata/opendatasite/tokei_kusei/nenreibetu.html
fields:
- name: survey_month
  title: 調査年月
  description: 各月1日時点
- name: age
  title: 年齢
  description: 原典の表記のまま。総計の行は「総 数」（全角空白入り）だが2026年6月だけ「総数」。年齢不詳は「不詳者」
- name: age_years
  title: 年齢（数値）
  description: Queria が付与。年齢が整数で表されている行だけ値が入る。総計の行と不詳者は NULL
- name: is_total
  title: 総計行
  description: Queria が付与。原典のラベルの揺れを畳んで、総計の行を true にする
- name: sex
  title: 性別
  description: 合計 / 男性 / 女性
- name: value
  title: 人数
- name: unit
  title: 単位
- name: source_url
  title: 取得元URL
- name: source_page
  title: 公開ページ
  description: 練馬区サイト上の、このデータの公開ページ
