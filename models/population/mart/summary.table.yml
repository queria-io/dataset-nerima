schema: population
name: summary
title: 世帯と人口（総括表）
description: 練馬区が公開する「世帯と人口（総括表）」。住民基本台帳による区全体の世帯数と人口を月次で収録する。1行=調査年月×統計項目×区分。統計項目は世帯数・総人口・日本人の人口・外国人の人口で、区分は男・女・計（世帯数は区分を持たない）。収録は2016年4月から2026年9月までの123か月。区が全期間をまとめて公開している1本のCSVから作っているので、月次ファイルを継ぎ足すことによる重複は起きない。ただし2021年10月・11月・12月は原典のまとめCSVに入っていない。
keywords:
- 練馬区
- 東京都
- 人口
- 世帯
- 住民基本台帳
- 時系列
published: true
sources:
