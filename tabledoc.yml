$schema: https://tabledoc.queria.io/schemas/dataset/v1.json
name: nerima
title: 練馬区オープンデータ
description: |-
  東京都練馬区が公開する、住民基本台帳による世帯と人口の月次の値（総括表・町丁目別・年齢別、2016 年 4 月から）と、避難拠点・帰宅支援ステーション・災害時給水ステーション・防災井戸の一覧です。区の AED・公共施設・指定緊急避難場所などは metro_tokyo の ods スキーマにあります。

  出典：練馬区オープンデータサイト（CC BY 4.0）を加工して作成。
image: cover.png
